name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          # cycc_aarch64 (renamed from cc5_aarch64 in Cyrius 6.0) may
          # ship under bin/ (picked up by the bin/* copy above) or at
          # the tarball top-level depending on the release. Cover both.
          # Same workaround sankoch / yukti carry.
          [ -f "$CYRIUS_DIR/cycc_aarch64" ] && cp "$CYRIUS_DIR/cycc_aarch64" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Verify toolchain
        run: cyrius --version

      - name: Resolve dependencies
        # Must run before any step that resolves `include "lib/..."`
        # (syntax check, api-surface, capacity, fmt, lint, vet, build).
        # `./lib/` is gitignored — `cyrius deps` populates it from
        # the version-pinned stdlib snapshot. Matches yukti/patra
        # convention.
        run: cyrius deps

      - name: Verify dep hashes
        # Skip on the first push that introduces a new dep before
        # `cyrius.lock` has been generated and committed. Once the
        # lockfile lands in-tree, this step starts enforcing hashes.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Syntax check
        run: |
          for f in src/*.cyr; do
            cyrius check "$f"
          done

      - name: API surface check
        run: scripts/check-api-surface.sh

      - name: Capacity gate
        run: cyrius capacity --check src/main.cyr

      - name: Format check
        # Drift gate: the formatter's output must match the committed file.
        #
        # Invoke `cyrfmt` directly, NOT `cyrius fmt`. As of cyrius 6.5.35 the
        # `cyrius fmt` subcommand is a silent no-op — it emits zero bytes and
        # exits 0 — so diffing its output against the file reported *every*
        # file as drifted while the sources were in fact correctly formatted.
        # That is what broke CI on the 6.5.27 -> 6.5.35 pin bump at 1.5.2.
        # `cyrfmt <file>` still emits formatted source to stdout, which is
        # what this gate needs. Do not "simplify" this back to `cyrius fmt`.
        #
        # The empty-output guard is the durable lesson: a formatter that
        # silently produces nothing must fail as a TOOLING error, never be
        # laundered into a source-drift report. The old gate's `2>/dev/null`
        # plus no output check is exactly what hid this.
        run: |
          command -v cyrfmt >/dev/null 2>&1 || {
            echo "ERROR: cyrfmt not on PATH — toolchain install is incomplete"; exit 1; }
          fail=0
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          for f in src/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            if ! cyrfmt "$f" > "$out"; then
              echo "ERROR: cyrfmt exited non-zero on $f — formatter error, not drift"
              exit 1
            fi
            if [ -s "$f" ] && [ ! -s "$out" ]; then
              echo "ERROR: cyrfmt produced no output for non-empty $f —"
              echo "       formatter is broken; this is NOT source drift."
              exit 1
            fi
            if ! diff -q "$out" "$f" > /dev/null; then
              echo "needs fmt: $f"
              diff -u "$f" "$out" | head -20 || true
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Lint
        # Auto-discover so new modules are covered without editing CI.
        # Treat any warning as a failure (fail on any cyrlint "  warn " line).
        run: |
          fail=0
          for f in src/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^\s*warn '; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Vet (include-graph audit)
        run: cyrius vet src/main.cyr

      - name: Verify dist bundles are in sync with src/
        # Post-decomposition (2026-06-19): full bundle + the single
        # `core` profile (error/util support + udev/drm). The old
        # security / storage / trust / system profiles were removed with
        # their modules. Each `cyrius distlib <profile>` reads the
        # matching `[lib.<profile>]` section in cyrius.cyml.
        run: |
          cyrius distlib
          for profile in core; do
            cyrius distlib "$profile"
          done
          fail=0
          for bundle in dist/agnodrm.cyr dist/agnodrm-core.cyr; do
            if ! git diff --quiet "$bundle"; then
              echo "ERROR: $bundle is stale. Run 'cyrius distlib [<profile>]' and commit the result."
              git --no-pager diff "$bundle" | head -40
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "all 2 dist bundles match src/"

      - name: Build (DCE)
        # `warning: undefined function 'X'` exits 0 when DCE proves the call
        # site unreachable, so the log has to be grepped — that is how
        # 1.5.2's `_agnos_getenv` reached a release (see the agnos
        # cross-build step below). A *reachable* undefined function is
        # already a hard build error; this covers the unreachable half.
        # Logs go to a file, not a `| tee` pipe: the default step shell is
        # `bash -e` with no pipefail, so a pipeline would mask cyrius's
        # own exit code behind tee's.
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/agnodrm > /tmp/build_x86_64.log 2>&1 || {
            cat /tmp/build_x86_64.log; echo "ERROR: x86_64 build failed"; exit 1; }
          cat /tmp/build_x86_64.log
          grep -q "warning: undefined function" /tmp/build_x86_64.log && {
            echo "ERROR: x86_64 build references undefined function(s)"; exit 1; }
          echo "agnodrm: $(wc -c < build/agnodrm) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/agnodrm | grep -q "7f45 4c46"

      - name: Cross-build aarch64
        # The toolchain translates x86_64 syscall numbers to aarch64
        # at codegen — no agnodrm source changes needed. Requires
        # cycc_aarch64 (renamed from cc5_aarch64 in Cyrius 6.0) in
        # the toolchain bin dir; tarball location is covered in the
        # install step above. If the toolchain release didn't bundle
        # it, skip with a warning rather than fail the whole build.
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ]; then
            echo "::warning::cycc_aarch64 not shipped with Cyrius $CYRIUS_VERSION — skipping aarch64 cross-build"
            exit 0
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/agnodrm-aarch64 \
            > /tmp/build_aarch64.log 2>&1 || {
            cat /tmp/build_aarch64.log; echo "ERROR: aarch64 build failed"; exit 1; }
          cat /tmp/build_aarch64.log
          grep -q "warning: undefined function" /tmp/build_aarch64.log && {
            echo "ERROR: aarch64 build references undefined function(s)"; exit 1; }
          for f in fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build --aarch64 "$f" "build/${name}-aarch64"
          done
          for bin in build/agnodrm-aarch64 build/*-aarch64; do
            [ -f "$bin" ] || continue
            file "$bin" | grep -q "aarch64" || {
              echo "ERROR: $bin is not an aarch64 ELF"; exit 1; }
          done
          echo "agnodrm-aarch64: $(wc -c < build/agnodrm-aarch64) bytes"

      - name: Cross-build agnos
        # agnodrm carries #ifdef CYRIUS_TARGET_AGNOS gating across
        # drm/udev/fuse/bootloader/netns/journald/update (added 1.4.6 +
        # 1.5.0). Without this step those codepaths are only ever compiled
        # in the Linux configuration and nothing verifies the agnos one.
        #
        # No toolchain guard, unlike --aarch64: --agnos needs no extra
        # compiler binary — it is the stock x86_64 backend plus the
        # CYRIUS_TARGET_AGNOS define — so this always runs.
        #
        # The exit code alone is not enough. At 1.5.2 `[deps] stdlib`
        # declared `io` but not `args`, so lib/io.cyr's getenv() delegated
        # to a never-included `_agnos_getenv`; DCE proved the call site
        # unreachable, cyrius warned, and the build exited 0. Any getenv()
        # on agnos would have jumped to an unresolved symbol.
        run: |
          CYRIUS_DCE=1 cyrius build --agnos src/main.cyr build/agnodrm-agnos \
            > /tmp/build_agnos.log 2>&1 || {
            cat /tmp/build_agnos.log; echo "ERROR: agnos build failed"; exit 1; }
          cat /tmp/build_agnos.log
          grep -q "warning: undefined function" /tmp/build_agnos.log && {
            echo "ERROR: agnos build references undefined function(s) —"
            echo "check [deps] stdlib in cyrius.cyml for a missing module"; exit 1; }
          xxd -l 4 build/agnodrm-agnos | grep -q "7f45 4c46" || {
            echo "ERROR: build/agnodrm-agnos is not an ELF"; exit 1; }
          echo "agnodrm-agnos: $(wc -c < build/agnodrm-agnos) bytes"

      - name: Smoke test
        run: |
          ./build/agnodrm | tee /tmp/smoke_output
          grep -q "agnodrm ready" /tmp/smoke_output

      - name: Integration tests
        run: |
          for t in tests/tcyr/*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "=== $name ==="
            CYRIUS_DCE=1 cyrius build "$t" "/tmp/ci_$name"
            "/tmp/ci_$name"
            rm -f "/tmp/ci_$name"
          done

      - name: Fuzz
        run: |
          for f in fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 10 "build/$name" 500 || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Benchmarks
        run: |
          CYRIUS_DCE=1 cyrius build tests/bcyr/bench_all.bcyr build/bench_all
          ./build/bench_all

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        # Use awk instead of "grep -v '# '" which would eat any line
        # with an inline comment and hide real hits.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # Raw execve(59) outside the security module's seccomp surface
          scan "raw execve"     'syscall( *59'
          # Direct shadow file access
          scan "shadow access"  '"/etc/shadow"'
          # Writes to system paths that agnodrm shouldn't touch
          scan "writes to /bin"  '"/bin/'
          scan "writes to /sbin" '"/sbin/'
          # Unbounded fn-scope buffers (cyrius emits `var buf[N]` inside
          # functions as STATIC DATA, not stack — consecutive calls
          # share the backing memory; any returned Str/buf borrow into
          # them is invalidated by the next call). Per audit F-5
          # (2026-04-26), surface anything >= 4 KB to make the class
          # visible. >= 64 KB fails the build.
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": FAIL large static buffer ("n" bytes): "$0
              else if (n >= 4096) print FILENAME":"NR": warn fn-scope buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          if grep -q "^.*: FAIL " /tmp/bigbuf.txt; then FAIL=1; fi
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
