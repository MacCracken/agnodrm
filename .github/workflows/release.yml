name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify
    # step below enforces semver shape + match against VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v1.0.1 == 1.0.1
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          grep -q '^version = "\${file:VERSION}"' cyrius.cyml || {
            echo "cyrius.cyml version must be \${file:VERSION}"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          # cycc_aarch64 (renamed from cc5_aarch64 in Cyrius 6.0) may
          # ship under bin/ or at the tarball top-level depending on
          # the release. Cover both.
          [ -f "$CYRIUS_DIR/cycc_aarch64" ] && cp "$CYRIUS_DIR/cycc_aarch64" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Verify toolchain
        run: cyrius --version

      - name: Resolve deps
        run: cyrius deps

      - name: Verify dep hashes
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Build (DCE)
        # Grep the log as well as the exit code: `warning: undefined
        # function 'X'` exits 0 when DCE proves the call site unreachable
        # (see the agnos cross-build step below). Redirect to a file rather
        # than `| tee` — the default step shell is `bash -e` with no
        # pipefail, so a pipeline would mask cyrius's exit code.
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/agnodrm > /tmp/build_x86_64.log 2>&1 || {
            cat /tmp/build_x86_64.log; echo "ERROR: x86_64 build failed"; exit 1; }
          cat /tmp/build_x86_64.log
          grep -q "warning: undefined function" /tmp/build_x86_64.log && {
            echo "ERROR: x86_64 build references undefined function(s)"; exit 1; }
          echo "agnodrm: $(wc -c < build/agnodrm) bytes"

      - name: Cross-build aarch64 (best-effort)
        # Produces build/agnodrm-aarch64 when the toolchain bundle
        # includes cycc_aarch64 (renamed from cc5_aarch64 in Cyrius
        # 6.0; tarball location is covered in the install step above).
        # Archive step ships both x86 + aarch64 binaries when present.
        run: |
          if [ -x "$HOME/.cyrius/bin/cycc_aarch64" ]; then
            CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/agnodrm-aarch64 \
              > /tmp/build_aarch64.log 2>&1 || {
              cat /tmp/build_aarch64.log; echo "ERROR: aarch64 build failed"; exit 1; }
            cat /tmp/build_aarch64.log
            grep -q "warning: undefined function" /tmp/build_aarch64.log && {
              echo "ERROR: aarch64 build references undefined function(s)"; exit 1; }
            echo "agnodrm-aarch64: $(wc -c < build/agnodrm-aarch64) bytes"
          else
            echo "::warning::cycc_aarch64 not in toolchain — aarch64 binary skipped in release"
          fi

      - name: Cross-build agnos (verify only)
        # Verified, not shipped. build/agnodrm is a smoke-test binary for a
        # library; agnos consumers take the .cyr bundle and build it
        # themselves with --agnos, so an agnos ELF in the release assets
        # would carry no consumer value. What matters is that the tag's
        # source actually compiles for agnos, with its
        # #ifdef CYRIUS_TARGET_AGNOS codepaths across
        # drm/udev/fuse/bootloader/netns/journald/update, and that it
        # resolves every symbol it calls.
        #
        # The grep is the real gate: at 1.5.2 a missing `args` entry in
        # `[deps] stdlib` left lib/io.cyr's getenv() delegating to an
        # undefined `_agnos_getenv`, DCE marked the call site unreachable,
        # and the build warned but exited 0. No toolchain guard is needed —
        # --agnos is the stock x86_64 backend plus the CYRIUS_TARGET_AGNOS
        # define, not a separate cross compiler.
        run: |
          CYRIUS_DCE=1 cyrius build --agnos src/main.cyr build/agnodrm-agnos \
            > /tmp/build_agnos.log 2>&1 || {
            cat /tmp/build_agnos.log; echo "ERROR: agnos build failed"; exit 1; }
          cat /tmp/build_agnos.log
          grep -q "warning: undefined function" /tmp/build_agnos.log && {
            echo "ERROR: agnos build references undefined function(s) —"
            echo "check [deps] stdlib in cyrius.cyml for a missing module"; exit 1; }
          xxd -l 4 build/agnodrm-agnos | grep -q "7f45 4c46" || {
            echo "ERROR: build/agnodrm-agnos is not an ELF"; exit 1; }
          echo "agnodrm-agnos: $(wc -c < build/agnodrm-agnos) bytes (verified, not shipped)"

      - name: Test
        run: |
          for t in tests/tcyr/*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "=== $name ==="
            CYRIUS_DCE=1 cyrius build "$t" "/tmp/ci_$name"
            "/tmp/ci_$name"
            rm -f "/tmp/ci_$name"
          done

      - name: Fuzz
        run: |
          for f in fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 10 "build/$name" 500 || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Regenerate dist bundles
        # Post-decomposition (2026-06-19): full bundle + the single
        # `core` profile. The old domain profiles were removed.
        run: |
          cyrius distlib
          for profile in core; do
            cyrius distlib "$profile"
          done

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="agnodrm-${TAG}/" -o "agnodrm-${TAG}-src.tar.gz" HEAD
          cp dist/agnodrm.cyr "agnodrm-${TAG}.cyr"
          # Ship the core profile bundle alongside the full one.
          for profile in core; do
            cp "dist/agnodrm-${profile}.cyr" "agnodrm-${TAG}-${profile}.cyr"
          done
          # Ship prebuilt binaries alongside source + bundle so
          # consumers can grab a statically-linked ELF per arch.
          if [ -f build/agnodrm ]; then
            cp build/agnodrm "agnodrm-${TAG}-x86_64-linux"
          fi
          if [ -f build/agnodrm-aarch64 ]; then
            cp build/agnodrm-aarch64 "agnodrm-${TAG}-aarch64-linux"
          fi
          sha256sum agnodrm-*.tar.gz agnodrm-*.cyr agnodrm-*-linux 2>/dev/null > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            agnodrm-*.tar.gz
            agnodrm-*.cyr
            agnodrm-*-linux
            cyrius.lock
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
      - uses: softprops/action-gh-release@v2
        with:
          name: "agnodrm ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            agnodrm-*.tar.gz
            agnodrm-*.cyr
            agnodrm-*-linux
            cyrius.lock
            SHA256SUMS
